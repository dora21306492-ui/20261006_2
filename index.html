<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <!-- 設定文件編碼為 UTF-8，避免中文亂碼。 -->
  <meta charset="UTF-8">

  <!-- 讓網頁在手機與平板上依照裝置寬度顯示。 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- 設定瀏覽器分頁標題。 -->
  <title>國小數學選擇題測驗</title>

  <!-- 載入 p5.js 主程式庫。 -->
  <script src="https://cdn.jsdelivr.net/npm/p5@1.11.1/lib/p5.min.js"></script>

  <!-- 載入本專案的 sketch.js 程式。 -->
  <script src="sketch.js"></script>

  <style>
    /* 讓 html 與 body 佔滿整個瀏覽器視窗。 */
    html,
    body {
      width: 100%;
      height: 100%;
    }

    /* 清除瀏覽器預設邊界並設定基礎背景。 */
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: #f7f9fc;
      font-family: Arial, "Noto Sans TC", sans-serif;
    }

    /* 讓 p5.js 產生的畫布以區塊方式顯示。 */
    canvas {
      display: block;
    }
  </style>
</head>
<body>
</body>
</html>
